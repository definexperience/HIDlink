; HIDlink firmware for the LilyGO T-Dongle-S3
;
; Build + flash:   pio run -e t-dongle-s3 -t upload
; See ../README.md for the full guide (incl. how to enter download mode).

[platformio]
default_envs = t-dongle-s3

[env]
; pioarduino = community PlatformIO platform with Arduino-ESP32 core 3.x
; (core 3.3+ is needed for USB keyboard boot-protocol support).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
framework = arduino
board = t-dongle-s3
monitor_speed = 115200
lib_deps =
    h2zero/NimBLE-Arduino@^2.3.0
    adafruit/Adafruit GFX Library@^1.11.9
build_flags =
    ; USB-OTG (TinyUSB) mode: the dongle shows up as a USB keyboard + mouse
    -DARDUINO_USB_MODE=0
    -DCORE_DEBUG_LEVEL=0
    ; the core's USB library (3.3.x) needs FS.h but PlatformIO's dependency
    ; finder doesn't add it for that library
    -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/FS/src

; Normal build: pure keyboard + mouse, no serial port on the PC.
[env:t-dongle-s3]
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=0

; Debug build: adds a USB serial port (log output, and re-flashing without
; holding the button). Handy while developing, not needed for service use.
[env:t-dongle-s3-debug]
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DHIDLINK_DEBUG=1

; T-Dongle-S3 variants without a display (e.g. T-Dongle-S3-Dual)
[env:t-dongle-s3-nolcd]
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DHAS_LCD=0

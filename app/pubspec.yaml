name: hidlink
description: Phone remote for the HIDlink BLE-to-USB keyboard/mouse dongle.
publish_to: 'none'
version: 1.1.1+3

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  # BLE for Android + iOS (BSD-3 licence, fine for commercial use)
  universal_ble: ^2.3.0
  shared_preferences: ^2.2.0

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

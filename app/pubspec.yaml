name: hidlink
description: Phone remote for the HIDlink BLE-to-USB keyboard/mouse dongle.
publish_to: 'none'
version: 1.1.4+6

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  # BLE for Android + iOS (BSD-3 licence, fine for commercial use)
  universal_ble: ^2.3.0
  shared_preferences: ^2.2.0
  # reads the app version for the About section (BSD-3 licence)
  package_info_plus: ^8.0.0

dev_dependencies:
  flutter_lints: ^4.0.0
  # generates the app icons from assets/icon (MIT licence, build-time only)
  flutter_launcher_icons: ^0.14.0

flutter:
  uses-material-design: true

# App icon, applied by `dart run tool/setup.dart` (source: ../assets/logo.svg)
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  remove_alpha_ios: true
  adaptive_icon_background: assets/icon/icon_background.png
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  min_sdk_android: 21
